# ==============================================================================
# Casa Luanda - Painel de Configurações do Sistema
# ==============================================================================
# Centralização de parâmetros configuráveis conforme diretrizes da skill externaliza-config.

header:
  logo:
    # Largura manual em pixels para exibição da imagem 'logo.png' no cabeçalho
    widthPx: 80

    # Altura manual em pixels para exibição da imagem 'logo.png' no cabeçalho
    heightPx: 80

hero:
  animation:
    # Duração da animação de fade suave de entrada do título (em milissegundos)
    fadeDurationMs: 1400

    # Tempo de espera após a conclusão do preloader antes de iniciar o fade (em milissegundos)
    fadeDelayMs: 300

    # Distância de rolagem em pixels para a transição completa de saída da Hero
    scrollDistancePx: 450

    # Deslocamento vertical adicional em pixels aplicado durante o scroll da Hero
    scrollTranslateYPx: -60

    # Opacidade mínima do título ao final da rolagem da seção Hero
    scrollMinOpacity: 0.0

mobileNavigation:
  # Feature flag booleana: ativa (true) ou desativa (false) o fluxo de bloqueio e liberação de rolagem exclusiva para dispositivos móveis
  enabled: true

  # Largura máxima de tela em pixels para classificar o dispositivo como mobile nos testes de capacidade
  breakpointWidth: 1024

  # Altura em unidades 'vh' do container de rolagem mínima no mobile (padrão: 118vh, entre 115vh e 120vh)
  scrollSpacerHeightVh: 118

  # Comportamento da rolagem ao tocar no botão ('smooth' para rolagem suave ou 'auto' para instantânea)
  scrollBehavior: "smooth"

  # Feature flag booleana: ativa (true) ou desativa (false) a animação suave de pulso/flutuação da seta para baixo
  bounceAnimation: true

eventos:
  background:
    # Caminho da imagem de fundo estática utilizada no WebGL da seção eventos no desktop
    desktopImage: "tudo/obts/casa.png"
    # Caminho da imagem de fundo estática vertical utilizada no WebGL da seção eventos em dispositivos móveis
    mobileImage: "tudo/obts/mb.casa.png"

  animation:
    # Opacidade inicial padrão aplicada a todos os cartazes em repouso
    baseOpacity: 0.2

    # Opacidade de destaque ao passar o cursor sobre o cartaz
    hoverOpacity: 1.0

    # Aumento percentual de escala dos cartazes centrais ao receber hover (+33.4%)
    hoverScalePercent: 33.4

    # Duração em milissegundos da transição de escala/opacidade e trava temporária contra oscilação nos cartazes de eventos
    hoverTransitionDurationMs: 500

    # Tempo de espera em milissegundos com o cursor sobre o cartaz antes de liberar o clique/redirecionamento (2000ms = 2s)
    clickDelayMs: 2000

  title:
    # Feature flag booleana: ativa (true) ou desativa (false) o efeito de brilho intenso no título da seção Últimos eventos
    glowEnabled: true

    # Intensidade multiplicadora do brilho do título (1.0 = 100% normal, 0.5 = suave, 2.0 = ultra intenso, 0.0 = sem brilho)
    glowIntensity: 1.0

    # Espaçamento horizontal entre as letras do título da seção (em unidades 'em', padrão 0.015)
    letterSpacingEm: 0.015

sobreNos:
  background:
    # Caminho da imagem de fundo ilustrada da seção Sobre Nós no desktop
    desktopImage: "tudo/obts/qmos.png"
    # Caminho da imagem de fundo ilustrada vertical da seção Sobre Nós em dispositivos móveis
    mobileImage: "tudo/obts/mb.qmos.png"

  card:
    # Largura percentual do card retangular em relação à viewport (padrão 94%, garantindo 3% de margem em cada lateral)
    widthPercent: 94

    # Raio de curvatura dos quatro cantos arredondados do card no desktop (em pixels, padrão 50px)
    borderRadiusPx: 50

    # Raio de curvatura das bordas arredondadas do card para telas menores e tablets (em pixels, padrão 24px)
    borderRadiusMobilePx: 24

    # Margem inferior em unidades 'vh' abaixo do card (0vh = estende o card até a base da tela sem sobrar margem inferior)
    marginBottomVh: 0

    # Altura mínima do card no desktop em unidades 'vh' para garantir visual editorial contínuo até a base da tela (padrão: 65vh)
    minHeightVh: 65

    # Altura mínima do card em visualização móvel em unidades 'vh' (padrão: 60vh)
    minHeightMobileVh: 60

    # Espaçamento interno generoso do card para garantir que leituras longas não toquem nos cantos curvos (em 'rem')
    paddingRem: 3.0

    # Espaçamento interno adaptado para dispositivos móveis (em 'rem')
    paddingMobileRem: 1.5

  title:
    # Feature flag booleana: ativa (true) ou desativa (false) o efeito de sombra luminosa multi-camadas no título SOBRE NÓS
    glowEnabled: true

    # Intensidade multiplicadora do brilho do título (1.0 = 100% normal, 0.6 = padrão institucional difuso, 0.0 = sem brilho)
    glowIntensity: 1.0

    # Espaçamento horizontal entre as letras do título SOBRE NÓS (em unidades 'em', padrão 0.015)
    letterSpacingEm: 0.015

  scroll:
    # Feature flag booleana: ativa (true) ou desativa (false) o isolamento dinâmico de scroll ao passar o cursor sobre o card
    wheelIsolation: true

    # Feature flag booleana: ativa (true) ou desativa (false) o indicador visual estilizado e trilha de rolagem do card
    indicatorEnabled: true

    # Feature flag booleana: ativa (true) ou desativa (false) a sutil animação de pulso vertical na seta indicadora para baixo
    bounceAnimation: true

    # Feature flag booleana: esmaece suavemente a seta indicadora quando o usuário atinge o final do conteúdo textual
    fadeOnEnd: true

    # Deslocamento vertical em pixels aplicado ao clicar na seta indicadora de rolagem para baixo
    stepScrollPx: 180

  editorial:
    # Largura máxima da imagem institucional marca.png em pixels na diagramação desktop (padrão: 280px)
    marcaMaxWidthPx: 280

    # Largura máxima da imagem institucional marca.png em pixels na visualização móvel (padrão: 200px)
    marcaMaxWidthMobilePx: 200

    # Espaçamento (gap) entre a coluna da imagem e a coluna de texto editorial no desktop (em rem, padrão: 3.0rem)
    columnsGapRem: 3.0

    # Altura da linha (line-height) dos parágrafos para leitura confortável contínua (padrão: 1.75)
    bodyLineHeight: 1.75

    # Espaçamento inferior uniforme em rem entre os parágrafos do texto (padrão: 1.25rem)
    paragraphMarginBottomRem: 1.25

